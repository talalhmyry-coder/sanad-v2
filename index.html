<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سَنَد | جامعة العلوم والتكنولوجيا</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B192C;
    --emerald:#0D9488;
    --gold:#D4AF37;
    --silver:#C0C0C0;
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --line:#E1E5EA;
    --soft:#EDEFF2;
    --wrong:#C0392B;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;line-height:1.75}
  button,input,select{font-family:inherit;color:inherit}
  [hidden]{display:none!important}

  header{
    background:var(--navy);padding:30px 16px 36px;border-bottom:4px solid var(--gold);
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .logo-frame{
    width:130px;
    height:130px;
    margin:10px auto 15px auto;
    border-radius:50%;
    border:2px solid #D4AF37;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 15px rgba(212,175,55,.3);
    background:#fff;
  }
  .logo{
    width:100%;
    height:100%;
    max-width:100%;
    object-fit:contain;
  }
  header .uni{width:100%;text-align:center;color:var(--gold);font-size:1.02rem;font-weight:700;margin-top:6px}
  header h1{width:100%;text-align:center;font-family:'Montserrat','Tajawal',sans-serif;direction:ltr;color:#fff;font-size:2.3rem;font-weight:700;letter-spacing:.4em;padding-inline-start:.4em;line-height:1.2}
  .slogan{width:100%;font-family:'Tajawal','Cairo',system-ui,sans-serif;color:var(--silver);font-size:15px;font-weight:500;text-align:center;margin:8px 0 10px}
  header .faculty{width:100%;text-align:center;display:inline-block;margin-top:4px;padding:5px 20px;border:1.5px solid var(--gold);border-radius:999px;color:#fff;font-size:.95rem;font-weight:500;background:rgba(212,175,55,.12)}
  header .rule{width:90px;height:2px;background:var(--gold);margin:10px auto 0;border-radius:2px}

  main{max-width:780px;margin:0 auto;padding:22px 14px 48px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 22px rgba(11,25,44,.07);padding:22px;margin-bottom:18px}
  .card h2{font-size:1.12rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--gold)}
  .card h2.center{justify-content:center;text-align:center;width:100%}
  .card h2.center::after{content:"";width:5px;height:20px;border-radius:3px;background:var(--gold)}

  .pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:13px 24px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s}
  .pill:hover{box-shadow:0 8px 18px rgba(11,25,44,.25);transform:translateY(-1px)}
  .pill:active{transform:scale(.98)}
  .pill[disabled]{opacity:.6;cursor:wait}
  .pill.outline{background:var(--surface);color:var(--navy)}
  .pill.outline:hover{background:var(--navy);color:#fff}
  .pill.emerald{background:var(--emerald);border-color:var(--emerald)}
  .pill.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
  .pill.big{padding:19px 26px;font-size:1.12rem}
  .pill.small{width:auto;padding:8px 20px;font-size:.92rem}

  #profile-form{margin-top:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:.85rem;margin-bottom:4px;font-weight:500}
  .opt-tag{font-weight:400;opacity:.65;font-size:.8rem}
  input[type=text]{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:1rem;background:var(--bg);transition:border .2s,box-shadow .2s}
  input[type=text]:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(13,148,136,.2)}
  select{width:100%;appearance:none;-webkit-appearance:none;padding:12px 18px 12px 42px;border:1.5px solid var(--line);border-radius:999px;font-size:1rem;color:var(--navy);cursor:pointer;
    background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%230B192C' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat left 18px center;transition:border .2s,box-shadow .2s}
  select:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(13,148,136,.2)}
  .msg{margin-top:12px;padding:12px 18px;border-radius:999px;font-weight:700;text-align:center}
  .msg.ok{background:var(--emerald);color:#fff}
  .msg.err{background:var(--surface);border:2px solid var(--wrong);color:var(--wrong)}

  .sem-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sem-tab{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px 10px;cursor:pointer;font-weight:700;font-size:1rem;text-align:center;transition:all .2s}
  .sem-tab small{display:block;font-weight:400;font-size:.8rem;opacity:.7}
  .sem-tab:hover{border-color:var(--gold)}
  .sem-tab[aria-expanded="true"]{background:var(--navy);border-color:var(--gold);color:#fff}
  .sem-tab[aria-expanded="true"] small{color:var(--gold);opacity:1}
  .sem-panel{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:6px 16px;animation:drop .3s ease}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .course{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .course:last-child{border-bottom:none}
  .code{direction:ltr;font-size:.8rem;background:var(--navy);color:var(--gold);border-radius:999px;padding:1px 12px}
  .empty{text-align:center;padding:16px 0;opacity:.75;font-size:.95rem}

  .screen{display:none}
  .screen.active{display:block}
  .back{margin-bottom:14px}
  .smart{text-align:center;padding:34px 18px;border:2px dashed var(--gold);border-radius:var(--radius);background:var(--bg)}
  .smart .ico{font-size:2.3rem}
  .smart p{font-weight:500;font-size:1.05rem;line-height:1.9}
  .lempty{margin-bottom:16px}

  .hero{background:var(--navy);border-bottom:4px solid var(--gold);border-radius:var(--radius);padding:26px 20px;text-align:center;margin-bottom:18px;box-shadow:0 6px 22px rgba(11,25,44,.12)}
  .hero .ico{font-size:2.4rem}
  .hero h2{color:#fff;font-size:1.35rem;font-weight:800;margin:4px 0}
  .hero p{color:var(--gold);font-size:.95rem}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .lcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:right;min-height:150px;background:var(--surface);border:1.5px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:0 4px 14px rgba(11,25,44,.06);transition:transform .2s,box-shadow .2s,border-color .2s}
  .lcard:hover{transform:translateY(-4px);border-color:var(--emerald);box-shadow:0 12px 26px rgba(11,25,44,.14)}
  .lcard .n{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800}
  .lcard .t{font-weight:700;font-size:1.02rem}
  .lcard .s{font-size:.84rem;opacity:.7}
  .lcard .go{margin-top:auto;color:var(--emerald);font-weight:700;font-size:.88rem}
  .ghost{pointer-events:none;border-style:dashed;border-top-color:var(--line);box-shadow:none;min-height:130px;gap:10px}
  .ghost i{display:block;height:12px;border-radius:999px;background:var(--soft);animation:pulse 1.6s ease-in-out infinite}
  .ghost i.c{width:38px;height:38px;border-radius:50%}
  .ghost i.l{width:85%}
  .ghost i.m{width:55%}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  .derivs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
  .deriv{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:18px 10px;cursor:pointer;font-weight:700;font-size:1rem;text-align:center;transition:all .2s}
  .deriv .i{display:block;font-size:1.6rem;margin-bottom:2px}
  .deriv:hover{border-color:var(--gold);transform:translateY(-2px)}
  .deriv.on{background:var(--navy);color:#fff;border-color:var(--gold)}
  #deriv-view{margin-top:16px}
  .box{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .box p{margin-bottom:10px}

  .mm ul{list-style:none;padding-inline-start:18px;border-inline-start:2px solid var(--gold)}
  .mm>ul{border:none;padding:0}
  .mm li{margin:8px 0}
  .mm .node{display:inline-block;background:var(--surface);border:1.5px solid var(--emerald);border-radius:999px;padding:3px 14px;font-weight:500}
  .mm>ul>li>.node{background:var(--navy);color:#fff;border-color:var(--gold);font-weight:700}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.cards{grid-template-columns:1fr}}
  .fc{height:140px;perspective:800px;cursor:pointer;background:none;border:none}
  .fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .fc.flip .fc-in{transform:rotateY(180deg)}
  .fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:grid;place-items:center;text-align:center;padding:14px;font-weight:700}
  .fc-f{background:var(--navy);color:#fff;border:2px solid var(--gold)}
  .fc-b{background:var(--surface);color:var(--navy);border:2px solid var(--emerald);transform:rotateY(180deg)}

  .qmeta{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:10px}
  .bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:16px}
  .bar>i{display:block;height:100%;background:var(--emerald);transition:width .3s}
  .qtext{font-size:1.1rem;font-weight:700;margin-bottom:14px}
  .opt{display:block;width:100%;text-align:right;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 20px;margin-bottom:10px;font-size:1rem;cursor:pointer;transition:all .2s}
  .opt:hover:not([disabled]){border-color:var(--gold)}
  .opt[disabled]{cursor:default}
  .opt.correct{background:var(--emerald);border-color:var(--emerald);color:#fff;font-weight:700}
  .opt.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;font-weight:700}
  .result{text-align:center;padding:10px 0}
  .score{font-size:2.6rem;font-weight:800;direction:ltr}
  .result p{font-size:1.05rem;font-weight:500;margin:10px 0 16px;line-height:1.9}
  .art h1,.art h2,.art h3,.art h4{margin:14px 0 6px;font-weight:800;line-height:1.5}
  .art ul,.art ol{padding-inline-start:24px;margin:6px 0 12px}
  .art li{margin:4px 0}
  .art table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92rem}
  .art th,.art td{border:1px solid var(--line);padding:6px 10px;text-align:right}
  .art blockquote{border-inline-start:3px solid var(--gold);padding:2px 12px;margin:8px 0;opacity:.9}
  .expl{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--emerald);font-size:.92rem}
  .rawtxt{white-space:pre-wrap}
  .grp{font-size:1rem;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
  .grp::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--gold)}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .ccard{display:flex;flex-direction:column;gap:6px;text-align:right;width:100%;background:var(--surface);border:1.5px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(11,25,44,.06);transition:transform .2s,box-shadow .2s,border-color .2s}
  .ccard:hover{transform:translateY(-2px);border-color:var(--emerald);box-shadow:0 12px 26px rgba(11,25,44,.14)}
  .ccard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ccard .t{font-weight:700;font-size:1.02rem}
  .ccard .s{font-size:.84rem;opacity:.75}
  .ccard.zero{opacity:.7}
  .lectures{display:flex;flex-direction:column;gap:10px}
  .unit{font-weight:800;font-size:.92rem;margin:10px 4px 0;color:var(--emerald)}
  .lrow{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
  .lrow:hover{border-color:var(--emerald);box-shadow:0 8px 20px rgba(11,25,44,.1);transform:translateY(-1px)}
  .lrow .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.92rem}
  .lrow .t{flex:1;font-weight:700}
  .lrow .go{flex:none;color:var(--emerald);font-weight:700;font-size:.85rem}

  .media-frame{margin:14px 0 4px;border:2px dashed var(--gold);border-radius:var(--radius);padding:10px 12px 12px;background:rgba(212,175,55,.07)}
  .media-cap{text-align:center;font-weight:800;font-size:.9rem;margin-bottom:8px}
  .media-frame .derivs{margin:0}
  .box.media{padding:10px}
  .mframe{display:block;width:100%;border:0;border-radius:14px;aspect-ratio:16/9;background:#000}
  .mframe.audio{aspect-ratio:auto;height:150px;background:var(--bg)}
  .box video,.box audio{width:100%;border-radius:14px}
  .mlink{margin-top:10px}

  body.noscroll{overflow:hidden}
  .fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;border:2px solid var(--gold);background:var(--navy);color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;font-size:.98rem;cursor:pointer;box-shadow:0 10px 24px rgba(11,25,44,.35);transition:transform .15s}
  .fab:active{transform:scale(.96)}
  .fab .e{font-size:1.25rem}
  .backdrop{position:fixed;inset:0;background:rgba(11,25,44,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:780px;height:82vh;display:flex;flex-direction:column;background:var(--surface);border-top:4px solid var(--gold);border-radius:24px 24px 0 0;box-shadow:0 -12px 34px rgba(11,25,44,.25);transform:translateY(105%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;z-index:60}
  .sheet.open{transform:none;visibility:visible;transition:transform .3s ease}
  .sheet-head{padding:8px 16px 10px;border-bottom:1px solid var(--line)}
  .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 8px}
  .sh-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sh-row strong{font-size:1.02rem}
  .x{flex:none;border:none;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
  #mentor-lesson{display:block;font-size:.82rem;opacity:.7;margin-top:2px}
  .chat{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
  .bub{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.8;font-size:.97rem;word-break:break-word}
  .bub.u{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
  .bub.b{align-self:flex-end;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:6px}
  .bub.err{align-self:flex-end;background:var(--surface);border:2px solid var(--wrong);color:var(--wrong)}
  .typing{align-self:flex-end;font-size:.88rem;opacity:.7}
  .chat-hint{text-align:center;font-size:.9rem;opacity:.75;padding:8px 6px}
  .remain{text-align:center;font-size:.78rem;opacity:.65;padding:2px 0 6px}
  .chat-input{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
  .chat-input input{flex:1;min-width:0}
  .chat-input .pill{flex:none}
  footer{text-align:center;font-size:.82rem;opacity:.7;padding-bottom:26px}
</style>
</head>
<body>

<header>
  <div class="logo-frame">
    <img class="logo" src="logo.jpg" alt="شعار منصة سند">
  </div>
  <div class="uni">جامعة العلوم والتكنولوجيا</div>
  <h1>SANAD</h1>
  <div class="slogan">معك من المحاضرة إلى الاختبار</div>
  <div class="faculty">كلية العلوم الإدارية والإنسانية</div>
  <div class="rule"></div>
</header>

<main>
  <section id="s-home" class="screen active">
    <div class="card">
      <button type="button" class="pill" id="edit-btn" aria-expanded="false">✎ تعديل بياناتي الجامعية</button>
      <form id="profile-form" hidden novalidate>
        <div class="grid">
          <div><label for="full_name">الاسم الكامل</label><input type="text" id="full_name"></div>
          <div><label for="student_id">الرقم الجامعي <span class="opt-tag">(اختياري)</span></label><input type="text" id="student_id" dir="ltr" inputmode="numeric"></div>
          <div><label for="program_code">التخصص الأكاديمي</label><select id="program_code"></select></div>
          <div><label for="level_code">المستوى الدراسي</label><select id="level_code"></select></div>
        </div>
        <button type="submit" class="pill emerald" id="save-btn" style="margin-top:14px">حفظ البيانات</button>
      </form>
      <div id="profile-msg" class="msg" hidden role="status"></div>
    </div>

    <div class="card">
      <h2 class="center">المقررات الدراسية</h2>
      <div class="sem-tabs">
        <button type="button" class="sem-tab" id="tab-1" aria-expanded="false">الفصل الدراسي الأول<small id="cnt-1">0 مقرر</small></button>
        <button type="button" class="sem-tab" id="tab-2" aria-expanded="false">الفصل الدراسي الثاني<small id="cnt-2">0 مقرر</small></button>
      </div>
      <div id="sem-panel" class="sem-panel" hidden></div>
    </div>

    <button type="button" class="pill gold big" id="tree-btn">📚 شجرة المحاضرات النشطة</button>
  </section>

  <section id="s-courses" class="screen">
    <button type="button" class="pill outline small back" data-go="home">→ رجوع</button>
    <div class="hero">
      <div class="ico">🌳</div>
      <h2>شجرة المحاضرات النشطة</h2>
      <p>اختر المقرر لعرض محاضراته النشطة</p>
    </div>
    <div id="course-tree"></div>
  </section>

  <section id="s-course" class="screen">
    <button type="button" class="pill outline small back" data-go="courses">→ رجوع للمقررات</button>
    <div class="hero">
      <div class="ico">📚</div>
      <h2 id="course-title"></h2>
      <p id="course-sub"></p>
    </div>
    <div id="lecture-list" class="lectures"></div>
  </section>

  <section id="s-lesson" class="screen">
    <button type="button" class="pill outline small back" data-go="course">→ رجوع للمحاضرات</button>
    <div class="card">
      <h2 id="lesson-title"></h2>
      <div class="derivs">
        <button type="button" class="deriv" data-d="explain"><span class="i">📖</span>الشرح</button>
        <button type="button" class="deriv" data-d="mindmap"><span class="i">🧠</span>الخريطة الذهنية</button>
        <button type="button" class="deriv" data-d="cards"><span class="i">🗂️</span>البطاقات</button>
        <button type="button" class="deriv" data-d="quiz"><span class="i">🎯</span>الكويز</button>
      </div>
      <div class="media-frame">
        <div class="media-cap">✨ الوسائط الإثرائية</div>
        <div class="derivs">
          <button type="button" class="deriv" data-d="video"><span class="i">🎬</span>الفيديو التلخيصي</button>
          <button type="button" class="deriv" data-d="podcast"><span class="i">🎧</span>البودكاست الصوتي</button>
        </div>
      </div>
      <div id="deriv-view"></div>
    </div>
  </section>
</main>

<script>
const BASE_URL = "https://rahf-n8n.app.n8n.cloud/webhook/sanad-v1-api";
const API_TIMEOUT_MS = 15000;

// أكواد التخصص مطابقة تماماً لما يقبله n8n (ACC / MGT / INT)
const PROGRAMS = [
  { name: "المحاسبة", code: "ACC" },
  { name: "إدارة الأعمال", code: "MGT" },
  { name: "إدارة الأعمال الدولية", code: "INT" }
];
const LEVELS = [
  { name: "المستوى الأول", code: "L1" },
  { name: "المستوى الثاني", code: "L2" },
  { name: "المستوى الثالث", code: "L3" },
  { name: "المستوى الرابع", code: "L4" }
];
const KEY_PROFILE = "sanad_profile_v3", KEY_DATA = "sanad_data_v5";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ---------- Telegram ---------- */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
const initData = (tg && tg.initData) ? tg.initData : "";
const OUTSIDE_TG_MSG = "تعمل منصة سَنَد من داخل تطبيق تيليجرام فقط. افتحها من البوت الرسمي.";
let registered = false;

/* ---------- API (طلب بسيط بلا preflight) ---------- */
async function api(action, extra, timeoutMs){
  if (!initData){ const e = new Error("NO_TELEGRAM"); e.code = "NO_TELEGRAM"; throw e; }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || API_TIMEOUT_MS);
  try{
    const params = new URLSearchParams();
    params.set("action", action);
    params.set("initData", initData);
    Object.entries(extra || {}).forEach(([k, v]) => params.set(k, v == null ? "" : String(v)));

    const r = await fetch(BASE_URL, {
      method: "POST",
      body: params, // Content-Type يُضبط تلقائياً: application/x-www-form-urlencoded (لا يحتاج preflight)
      signal: ctrl.signal,
      cache: "no-store"
    });
    const raw = await r.text();
    let res = null;
    try { res = raw ? JSON.parse(raw) : null; } catch (_) {}
    if (!res || typeof res !== "object") throw new Error("رد غير مفهوم من الخادم (HTTP " + r.status + ")");
    if (!r.ok || res.ok === false){
      const e = new Error(res.message || ("HTTP " + r.status)); e.server = true; e.code = res.error_code || ""; throw e;
    }
    return res;
  } finally { clearTimeout(timer); }
}
function errText(err){
  if (err && err.code === "NO_TELEGRAM") return OUTSIDE_TG_MSG;
  if (err && err.name === "AbortError") return "انتهت مهلة الاتصال. تحقق من الشبكة وأعد المحاولة.";
  if (err && err.server) return err.message;
  if (err instanceof TypeError) return "تعذّر الاتصال بالخادم. تحقق من الشبكة وأعد المحاولة.";
  return "تعذّر إتمام العملية: " + ((err && err.message) || "خطأ غير معروف");
}

/* ---------- Selects ---------- */
function fillSelect(id, placeholder, items){
  const s = $(id);
  const ph = el("option", "", placeholder); ph.value = ""; ph.disabled = true; ph.selected = true;
  s.appendChild(ph);
  items.forEach(i => { const o = el("option", "", i.name); o.value = i.code; s.appendChild(o); });
}
fillSelect("program_code", "اختر التخصص الأكاديمي", PROGRAMS);
fillSelect("level_code", "اختر المستوى الدراسي", LEVELS);

let data = { s1: [], s2: [], lessons: [], courses: [] };
let openSem = null;

/* ---------- تحليل رد n8n ---------- */
const arr = (v) => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);

// المقررات تُبنى من courses (كل مقررات التخصص والمستوى حسب term_code: T1 / T2)،
// والمحاضرات من active_curriculum (المحاضرات النشطة فقط). كلاهما يأتيان في ردّ init-session و register-student و update-profile.
const termKey = (v) => {
  const t = String(v || "").trim().toLowerCase();
  if (/^(t|s|sem|term)?[\s_-]*0?1$|first|1st|أول|اول/.test(t)) return 1;
  if (/^(t|s|sem|term)?[\s_-]*0?2$|second|2nd|ثان/.test(t)) return 2;
  return 0;
};
function parseSession(res, filter){
  const src = (res && res.active_curriculum && typeof res.active_curriculum === "object") ? res.active_curriculum : (res || {});
  const rows = (k) => arr(src[k]).filter(r => r && typeof r === "object");
  const keep = (r) => !filter || (
    (!r.program_code || String(r.program_code).trim() === filter.program) &&
    (!r.level_code || String(r.level_code).trim() === filter.level)
  );
  const norm = (r) => Object.assign({}, r, {
    title: r.lesson_title || r.title || r.lesson_code || "محاضرة",
    course_name: r.course_name || r.course_code || ""
  });
  const all = rows("lessons").length ? rows("lessons") : [...rows("first_semester"), ...rows("second_semester"), ...rows("unassigned_semester")];
  const seen = new Set();
  const lessons = all.filter(keep).map(norm).filter(r => {
    const k = (r.course_code || "") + "__" + (r.lesson_code || r.title);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  // ترتيب اختياري: إن وُجد عمود ترتيب رقمي في كل الصفوف نستخدمه، وإلا يبقى ترتيب الشيت كما هو
  const ORDER_KEYS = ["lesson_order", "order", "sort_order", "display_order", "seq", "lesson_no"];
  const ok = lessons.length ? ORDER_KEYS.find(k => lessons.every(r => r[k] !== undefined && r[k] !== "" && Number.isFinite(Number(r[k])))) : null;
  if (ok) lessons.sort((a, b) => Number(a[ok]) - Number(b[ok]));

  // المقررات: من courses (كل مقررات التخصص والمستوى) + أي مقرر له محاضرات نشطة
  const cmap = new Map();
  const addC = (c, term) => {
    const k = c.course_code || c.course_name;
    if (!k) return;
    const ex = cmap.get(k);
    if (!ex) cmap.set(k, { course_code: c.course_code || "", course_name: c.course_name || c.course_code || "", term: term || 0 });
    else if (!ex.term && term) ex.term = term;
  };
  arr(res && res.courses).filter(c => c && typeof c === "object").forEach(c => addC(c, termKey(c.term_code)));
  lessons.forEach(r => addC(r, termKey(r.term_code)));
  const courses = [...cmap.values()];
  return { s1: courses.filter(c => c.term === 1), s2: courses.filter(c => c.term === 2), lessons, courses };
}

const cName = (c) => typeof c === "string" ? c : (c.name || c.course_name || c.title || c.name_ar || "مقرر");
const cCode = (c) => typeof c === "string" ? "" : (c.code || c.course_code || "");

function renderSemesters(){
  $("cnt-1").textContent = data.s1.length + " مقرر";
  $("cnt-2").textContent = data.s2.length + " مقرر";

}
function drawPanel(){

  list.forEach(c => {
    const row = el("div", "course"); row.appendChild(el("span", "", cName(c)));
    if (cCode(c)) row.appendChild(el("span", "code", cCode(c)));
    p.appendChild(row);
  });
  p.hidden = false;
}
[1,2].forEach(n => $("tab-" + n).addEventListener("click", () => { openSem = (openSem === n ? null : n); drawPanel(); }));

function go(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === "s-" + name));
  syncFab(name);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

let currentLesson = null, currentCourse = null;
const lessonsOf = (c) => data.lessons.filter(l => c.course_code ? l.course_code === c.course_code : l.course_name === c.course_name);
const TERM_LABEL = { 1: "الفصل الدراسي الأول", 2: "الفصل الدراسي الثاني", 0: "مقررات أخرى" };
function arCount(n){
  if (n === 1) return "محاضرة واحدة نشطة";
  if (n === 2) return "محاضرتان نشطتان";
  if (n >= 3 && n <= 10) return n + " محاضرات نشطة";
  return n + " محاضرة نشطة";
}
const activeScreen = () => { const s = document.querySelector(".screen.active"); return s ? s.id.replace("s-", "") : ""; };

/* شجرة المحاضرات: (1) اختيار المقرر ← (2) صفحة المقرر بكل محاضراته النشطة مرتبة عمودياً (قائمة ديناميكية بلا حد أقصى) */
function renderCourseTree(){
  const box = $("course-tree"); box.replaceChildren();
  if (!data.courses.length){
    const m = el("div", "smart lempty");
    m.append(el("div", "ico", "⏳"), el("p", "", "جاري العمل من قبل الطاقم الأكاديمي في سَنَد على تجهيز محاضرات ومقررات مستواك. سيتم إشعارك فور توفرها."));
    box.appendChild(m); return;
  }
  [1, 2, 0].forEach(t => {
    const list = data.courses.filter(c => (c.term || 0) === t);
    if (!list.length) return;
    box.appendChild(el("div", "grp", TERM_LABEL[t]));
    const grid = el("div", "cgrid");
    list.forEach(c => {
      const n = lessonsOf(c).length;
      const b = el("button", "ccard" + (n ? "" : " zero")); b.type = "button";
      const row = el("div", "row"); row.appendChild(el("span", "t", c.course_name || c.course_code));

      b.addEventListener("click", () => { currentCourse = c; renderCourse(); go("course"); });
      grid.appendChild(b);

}
function renderCourse(){
  const c = currentCourse; if (!c) return;
  const list = lessonsOf(c);
  $("course-title").textContent = c.course_name || c.course_code || "المقرر";
  $("course-sub").textContent = list.length ? arCount(list.length) : "لا توجد محاضرات نشطة بعد";
  const box = $("lecture-list"); box.replaceChildren();
  if (!list.length){
    const m = el("div", "smart lempty");
    m.append(el("div", "ico", "⏳"), el("p", "", "لم تُنشر محاضرات هذا المقرر بعد. سيتم إشعارك فور توفرها."));
    box.appendChild(m); return;
  }
  let lastUnit = "";
  list.forEach((L, i) => {
    const unit = String(L.unit_title || "").trim();
    if (unit && unit !== lastUnit) box.appendChild(el("div", "unit", unit));
    if (unit) lastUnit = unit;
    const b = el("button", "lrow"); b.type = "button";
    b.append(el("span", "n", i + 1), el("span", "t", L.title), el("span", "go", "فتح ←"));
    b.addEventListener("click", () => openLesson(L));

$("tree-btn").addEventListener("click", () => { renderCourseTree(); go("courses"); });

/* تحديث شامل: يُستدعى بعد أي تحميل أو حفظ للبيانات فتنعكس التغييرات فوراً على الفصلين وعلى الشجرة */
function applyData(){
  renderSemesters();
  renderCourseTree();
  if (currentCourse){
    const fresh = data.courses.find(c => c.course_code ? c.course_code === currentCourse.course_code : c.course_name === currentCourse.course_name);
    if (fresh){
      currentCourse = fresh; renderCourse();
      if (currentLesson && activeScreen() === "lesson" && !lessonsOf(fresh).some(l => l.lesson_code === currentLesson.lesson_code)){ currentLesson = null; go("course"); }
    } else {
      currentCourse = null; currentLesson = null;
      if (["course", "lesson"].includes(activeScreen())) go("courses");
    }
  }
}

let viewSeq = 0;
const lessonCache = new Map();

function openLesson(L){
  currentLesson = L;
  viewSeq++;
  $("lesson-title").textContent = L.title || L.name || L.lesson_name || "المحاضرة";
  $("deriv-view").replaceChildren();
  document.querySelectorAll(".deriv").forEach(d => d.classList.remove("on"));
  go("lesson");
}

/* ---------- محتوى المحاضرة: get-lesson (صف Lesson_Assets كاملاً) ---------- */
function parseMaybeJSON(v){
  if (v == null) return null;
  if (typeof v === "object") return v;
  const s = String(v).trim();
  if (!s) return null;
  try { return JSON.parse(s); } catch (_) { return null; }
}
function normQuiz(raw){
  const p = parseMaybeJSON(raw);
  if (!p) return [];
  const list = Array.isArray(p) ? p : (Array.isArray(p.questions) ? p.questions : []);
  return list.map(q => {
    if (!q || typeof q !== "object") return null;
    const opts = arr(q.options || q.choices || q.answers).map(String);
    let ci = q.correct_option_index ?? q.correct_index ?? q.correctIndex ?? q.correct ?? q.answer ?? q.correct_answer;
    if (typeof ci === "string"){
      const t = ci.trim(); const k = opts.findIndex(o => o.trim() === t);
      if (k >= 0) ci = k;
      else if (/^\d+$/.test(t)) ci = Number(t);
      else if (/^[A-Da-d]$/.test(t)) ci = t.toUpperCase().charCodeAt(0) - 65;
      else ci = -1;
    }
    return { text: String(q.question || q.q || q.text || ""), opts, ci: Number.isInteger(ci) ? ci : -1, explanation: String(q.explanation || "") };
  }).filter(q => q && q.text && q.opts.length >= 2 && q.ci >= 0 && q.ci < q.opts.length);
}
function normCards(raw){
  const p = parseMaybeJSON(raw);
  if (!p) return [];
  const list = Array.isArray(p) ? p : (Array.isArray(p.cards) ? p.cards : (Array.isArray(p.flashcards) ? p.flashcards : []));
  const strip = (s) => String(s == null ? "" : s).replace(/<\/?[a-zA-Z][^>]*>/g, "").trim();
  return list.map(c => (c && typeof c === "object") ? { front: strip(c.front ?? c.question ?? c.q), back: strip(c.back ?? c.answer ?? c.a) } : null).filter(c => c && (c.front || c.back));
}
function pickUrl(r, re){
  for (const [k, v] of Object.entries(r || {})) if (re.test(k) && /^https?:\/\//i.test(String(v || "").trim())) return String(v).trim();
  return "";
}
function normLesson(r){
  return {
    article: String(r.Detailed_Article_HTML || "").trim(),
    mind: String(r.Mindmap_Text || "").trim(),
    cards: normCards(r.Flashcards_JSON),
    quiz: normQuiz(r.Quiz_Data_JSON),
    video: pickUrl(r, /video/i),
    audio: pickUrl(r, /audio|podcast/i)
  };
}
async function loadLesson(L){
  const code = String((L && L.lesson_code) || "").trim();
  if (!code) return {};
  if (lessonCache.has(code)) return lessonCache.get(code);
  const full = normLesson(await api("get-lesson", { lesson_code: code }));
  lessonCache.set(code, full);
  return full;
}

document.querySelectorAll(".deriv").forEach(btn => btn.addEventListener("click", async () => {
  document.querySelectorAll(".deriv").forEach(d => d.classList.toggle("on", d === btn));
  const v = $("deriv-view"); v.replaceChildren();
  const my = ++viewSeq;
  const wait = el("div", "box"); wait.appendChild(el("p", "", "جاري تحميل المحتوى…")); v.appendChild(wait);
  let full = {}, failed = null;
  try { full = await loadLesson(currentLesson); } catch (err){ failed = err; }
  if (my !== viewSeq) return;
  v.replaceChildren();
  if (failed && failed.code !== "LESSON_NOT_FOUND"){
    const b = el("div", "box"); b.appendChild(el("p", "", errText(failed))); v.appendChild(b); return;
  }
  ({ explain: viewExplain, mindmap: viewMindmap, cards: viewCards, quiz: startQuiz, video: viewVideo, podcast: viewPodcast })[btn.dataset.d](v, full || {});
}));
const pending = (v) => { const b = el("div", "box"); b.appendChild(el("p", "", "هذا المحتوى قيد التجهيز من الطاقم الأكاديمي.")); v.appendChild(b); };

/* الوسائط الإثرائية: الفيديو التلخيصي (Video_URL) والبودكاست الصوتي (Audio_URL) */
function mediaView(v, url, kind){
  const u = String(url || "").trim();
  if (!/^https?:\/\//i.test(u)) return pending(v);
  const box = el("div", "box media");
  let m, frame = null;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/))){
    frame = "https://www.youtube.com/embed/" + m[1];
  } else if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/))){
    frame = "https://drive.google.com/file/d/" + m[1] + "/preview";
  }
  if (frame){
    const f = el("iframe", "mframe" + (kind === "audio" ? " audio" : ""));
    f.src = frame; f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
    f.setAttribute("allowfullscreen", ""); f.setAttribute("loading", "lazy"); f.title = kind === "audio" ? "البودكاست الصوتي" : "الفيديو التلخيصي";
    box.appendChild(f);
  } else if (kind === "video" && /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u)){
    const p = el("video"); p.controls = true; p.setAttribute("playsinline", ""); p.preload = "metadata"; p.src = u; box.appendChild(p);
  } else if (kind === "audio" && /\.(mp3|m4a|wav|ogg|aac)(\?|#|$)/i.test(u)){
    const p = el("audio"); p.controls = true; p.preload = "metadata"; p.src = u; box.appendChild(p);
  }
  const a = el("a", "pill outline small mlink", kind === "audio" ? "فتح البودكاست في نافذة خارجية ↗" : "فتح الفيديو في نافذة خارجية ↗");
  a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.addEventListener("click", (e) => { if (tg && typeof tg.openLink === "function"){ e.preventDefault(); tg.openLink(u); } });
  box.appendChild(a);
  v.appendChild(box);
}
const viewVideo = (v, L) => mediaView(v, L.video, "video");
const viewPodcast = (v, L) => mediaView(v, L.audio, "audio");

/* تنقية HTML الشرح: نسمح بوسوم التنسيق فقط ونحذف كل الخصائص والسكربتات */
const HTML_OK = new Set(["P","BR","H1","H2","H3","H4","H5","H6","UL","OL","LI","STRONG","B","EM","I","U","BLOCKQUOTE","TABLE","THEAD","TBODY","TR","TH","TD","SPAN","DIV","SUP","SUB","HR","MARK","CODE","PRE","SMALL"]);
const HTML_DROP = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","SVG","MATH","FORM","INPUT","BUTTON","TEXTAREA","SELECT","IMG","VIDEO","AUDIO"]);
function sanitizeInto(parent, src){
  src.childNodes.forEach(n => {
    if (n.nodeType === 3){ parent.appendChild(document.createTextNode(n.nodeValue)); return; }
    if (n.nodeType !== 1) return;
    if (HTML_DROP.has(n.tagName)) return;
    if (HTML_OK.has(n.tagName)){ const c = document.createElement(n.tagName.toLowerCase()); sanitizeInto(c, n); parent.appendChild(c); }
    else sanitizeInto(parent, n);
  });
}
function viewExplain(v, L){
  const html = String(L.article || "").trim();
  if (!html) return pending(v);
  const b = el("div", "box art");
  if (/<[a-zA-Z][^>]*>/.test(html)) sanitizeInto(b, new DOMParser().parseFromString(html, "text/html").body);
  else html.split(/\n+/).forEach(x => b.appendChild(el("p", "", x)));
  v.appendChild(b);
}

/* الخريطة الذهنية: Mindmap_Text نص بسيط (قوائم بمسافات/شرطات/عناوين #) أو JSON شجري */
function parseMindmap(text){
  const root = { children: [] }, stack = [{ indent: -1, node: root }];
  String(text).replace(/\r/g, "").split("\n").forEach(raw => {
    if (!raw.trim() || /^\s*(```|mindmap\b)/i.test(raw)) return;
    const h = raw.match(/^\s*(#{1,6})\s+/);
    const indent = h ? (h[1].length - 1) * 4 : raw.match(/^\s*/)[0].replace(/\t/g, "    ").length;
    const label = raw.trim().replace(/^(#{1,6}|[-*•+]|\d+[.)])\s+/, "").replace(/^[A-Za-z_]*[(\[{]{1,2}(.*?)[)\]}]{1,2}$/, "$1").trim();
    if (!label) return;
    while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
    const node = { title: label, children: [] };
    stack[stack.length - 1].node.children.push(node);
    stack.push({ indent, node });
  });
  return root.children;
}
function viewMindmap(v, L){
  const text = String(L.mind || "").trim();
  if (!text) return pending(v);
  const j = parseMaybeJSON(text);
  const roots = j ? (Array.isArray(j) ? j : [j]) : parseMindmap(text);
  if (!roots.length){ const b = el("div", "box"); b.appendChild(el("p", "rawtxt", text)); v.appendChild(b); return; }
  const build = (node) => {
    const li = el("li");
    const label = typeof node === "string" ? node : (node.title || node.label || node.name || node.text || "");
    li.appendChild(el("span", "node", label));
    const kids = (typeof node === "object" && node) ? arr(node.children || node.branches) : [];
    if (kids.length){ const ul = el("ul"); kids.forEach(k => ul.appendChild(build(k))); li.appendChild(ul); }
    return li;
  };
  const wrap = el("div", "box mm"), ul = el("ul");
  roots.forEach(n => ul.appendChild(build(n)));
  wrap.appendChild(ul); v.appendChild(wrap);
}
function viewCards(v, L){
  const list = Array.isArray(L.cards) ? L.cards : [];
  if (!list.length) return pending(v);
  const g = el("div", "cards");
  list.forEach(c => {
    const b = el("button", "fc"); b.type = "button";
    const inn = el("div", "fc-in"); inn.append(el("div", "fc-f", c.front), el("div", "fc-b", c.back));
    b.appendChild(inn); b.addEventListener("click", () => b.classList.toggle("flip")); g.appendChild(b);
  });
  v.appendChild(g);
}

function startQuiz(v, L){
  const qs = Array.isArray(L.quiz) ? L.quiz : [];
  if (!qs.length) return pending(v);
  let i = 0, score = 0;
  const box = el("div", "box"); v.appendChild(box);

  function show(){
    box.replaceChildren();
    const meta = el("div", "qmeta"); meta.append(el("span", "", "السؤال " + (i + 1) + " من " + qs.length), el("span", "", "النتيجة: " + score));
    const bar = el("div", "bar"), fill = el("i"); fill.style.width = (i / qs.length * 100) + "%"; bar.appendChild(fill);
    const q = qs[i];
    box.append(meta, bar, el("div", "qtext", q.text));
    const btns = q.opts.map((o, k) => {
      const b = el("button", "opt", o); b.type = "button"; box.appendChild(b);
      b.addEventListener("click", () => choose(k));
      return b;
    });
    function choose(k){
      btns.forEach(b => b.disabled = true);
      btns[q.ci].classList.add("correct");
      if (k === q.ci) score++; else btns[k].classList.add("wrong");
      if (q.explanation) box.appendChild(el("div", "expl", q.explanation));
      const next = el("button", "pill small", i + 1 < qs.length ? "السؤال التالي" : "عرض النتيجة");
      next.type = "button"; next.style.margin = "10px auto 0";
      next.addEventListener("click", () => { i++; i < qs.length ? show() : finish(); });
      box.appendChild(next);
    }
  }
  function finish(){
    box.replaceChildren();
    const ratio = score / qs.length;
    let msg;
    if (ratio < 0.5) msg = "لم يحالفك الحظ هذه المرة. الأخطاء هي فرص للتعلم. راجع الشرح الأكاديمي وحاول مجدداً.";
    else if (ratio < 1) msg = "نتيجة جيدة. راجع الأسئلة التي أخطأت فيها لتثبيت الفهم.";
    else msg = "نتيجة كاملة. أتقنت محتوى هذه المحاضرة.";
    const r = el("div", "result");
    r.append(el("div", "score", score + "/" + qs.length), el("p", "", msg));
    const again = el("button", "pill small", "إعادة الكويز"); again.type = "button"; again.style.margin = "0 auto 8px";
    again.addEventListener("click", () => { i = 0; score = 0; show(); });
    const rev = el("button", "pill outline small", "مراجعة الشرح"); rev.type = "button"; rev.style.margin = "0 auto";
    rev.addEventListener("click", () => document.querySelector('.deriv[data-d="explain"]').click());
    r.append(again, rev); box.appendChild(r);
  }
  show();
}

/* ---------- النموذج والحفظ ---------- */
const form = $("profile-form"), msg = $("profile-msg");
let msgTimer = null;
function flash(text, type, ms){
  clearTimeout(msgTimer);
  msg.textContent = text; msg.className = "msg " + type; msg.hidden = false;
  if (ms) msgTimer = setTimeout(() => { msg.hidden = true; }, ms);
}
function openForm(open){
  form.hidden = !open;
  $("edit-btn").setAttribute("aria-expanded", String(open));
}
$("edit-btn").addEventListener("click", () => {
  const open = form.hidden; openForm(open);
  if (open && initData) msg.hidden = true;
});
function cacheState(profile){
  try{
    if (profile) localStorage.setItem(KEY_PROFILE, JSON.stringify(profile));
    localStorage.setItem(KEY_DATA, JSON.stringify(data));
  }catch(_){}
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const profile = {
    full_name: $("full_name").value.trim(),
    student_id: $("student_id").value.trim(), // يُحفظ محلياً فقط، لا يوجد له حقل في n8n
    program_code: $("program_code").value.trim(),
    level_code: $("level_code").value.trim()
  };
  if (!initData){ flash(OUTSIDE_TG_MSG, "err"); return; }
  if (profile.full_name.length < 5){ flash("يرجى إدخال الاسم الكامل (5 أحرف على الأقل).", "err"); return; }
  if (!profile.program_code || !profile.level_code){ flash("يرجى اختيار التخصص الأكاديمي والمستوى الدراسي.", "err"); return; }

  const btn = $("save-btn"); btn.disabled = true; btn.textContent = "جاري الحفظ...";
  try{
    const filter = { program: profile.program_code, level: profile.level_code };
    if (registered){
      // طالب مسجّل: تحديث الملف الشخصي فقط (لا يمس XP ولا التقدم) ثم جلب المقررات
      let res = await api("update-profile", { full_name: profile.full_name, major: profile.program_code, level: profile.level_code });
      // الرد الجديد يحمل courses و active_curriculum؛ إن لم يحملهما (نسخة قديمة) نجلب المنهج بشكل منفصل
      if (!res.active_curriculum) res = Object.assign({}, await api("get-curriculum"), { courses: res.courses });
      data = parseSession(res, filter);
    } else {
      // طالب جديد: تسجيل كامل، والرد يحمل active_curriculum
      const res = await api("register-student", { full_name: profile.full_name, program_code: profile.program_code, level_code: profile.level_code });
      registered = (res.status === "REGISTERED");
      data = parseSession(res, filter);
    }
    cacheState(profile);
    applyData();
    openForm(false);
    flash("تم الاعتماد وتحديث السجل الأكاديمي", "ok", 5000);
  }catch(err){
    console.error("submit error:", err);
    flash(errText(err), "err");
  }finally{
    btn.disabled = false; btn.textContent = "حفظ البيانات";
  }
});

/* ---------- دكتور سَنَد (ask-mentor) ---------- */
const fab = $("mentor-fab"), sheet = $("mentor-sheet"), backdrop = $("mentor-backdrop");
const mLog = $("mentor-log"), mForm = $("mentor-form"), mQ = $("mentor-q"), mSend = $("mentor-send"), mRemain = $("mentor-remain");
const MENTOR_TIMEOUT_MS = 45000; // الرد يمرّ بـ Gemini وعدة قراءات شيت، فنمنحه مهلة أطول من 15 ثانية
let mentorFor = null, mentorBusy = false;

function syncFab(name){
  fab.hidden = (name !== "lesson");
  if (name !== "lesson") closeMentor();
}
function renderRich(box, text){
  String(text || "").replace(/\r/g, "").split("\n").forEach(line => {
    if (!line.trim()) return;
    const d = el("div");
    line.replace(/^\s*[*-]\s+/, "• ").split(/(\*\*[^*]+\*\*)/).forEach(seg => {
      if (/^\*\*[^*]+\*\*$/.test(seg)) d.appendChild(el("strong", "", seg.slice(2, -2)));
      else if (seg) d.appendChild(document.createTextNode(seg.replace(/\*/g, "")));
    });
    box.appendChild(d);
  });
}
function addBubble(kind, text){
  const b = el("div", "bub " + kind);
  if (kind === "b") renderRich(b, text); else b.textContent = text;
  mLog.appendChild(b); mLog.scrollTop = mLog.scrollHeight; return b;
}
function openMentor(){
  if (!currentLesson) return;
  const code = String(currentLesson.lesson_code || "");
  if (mentorFor !== code){
    mentorFor = code; mLog.replaceChildren(); mRemain.hidden = true;
    mLog.appendChild(el("div", "chat-hint", "اسأل دكتور سَنَد عن أي نقطة في هذه المحاضرة وسيشرحها لك بأسلوب مبسّط."));
  }
  $("mentor-lesson").textContent = currentLesson.title || "";
  sheet.classList.add("open"); backdrop.classList.add("open"); document.body.classList.add("noscroll");
  setTimeout(() => { try { mQ.focus(); } catch (_) {} }, 320);
}
function closeMentor(){
  sheet.classList.remove("open"); backdrop.classList.remove("open"); document.body.classList.remove("noscroll");
}
fab.addEventListener("click", openMentor);
backdrop.addEventListener("click", closeMentor);
$("mentor-close").addEventListener("click", closeMentor);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMentor(); });

mForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (mentorBusy || !currentLesson) return;
  const q = mQ.value.trim();
  if (q.length < 3){ addBubble("err", "يرجى كتابة سؤالك بوضوح (3 أحرف على الأقل)."); return; }
  if (!initData){ addBubble("err", OUTSIDE_TG_MSG); return; }
  mentorBusy = true; mSend.disabled = true; mQ.disabled = true;
  addBubble("u", q); mQ.value = "";
  const typing = el("div", "typing", "دكتور سَنَد يكتب…"); mLog.appendChild(typing); mLog.scrollTop = mLog.scrollHeight;
  try{
    const res = await api("ask-mentor", { lesson_code: currentLesson.lesson_code || "", student_question: q }, MENTOR_TIMEOUT_MS);
    typing.remove();
    addBubble("b", res.mentor_reply || "تعذّر الحصول على رد، حاول مرة أخرى.");
    if (typeof res.remaining_daily_questions === "number"){
      mRemain.textContent = "المتبقي اليوم: " + res.remaining_daily_questions + " سؤالاً"; mRemain.hidden = false;
    }
  }catch(err){
    typing.remove(); addBubble("err", errText(err));
  }finally{
    mentorBusy = false; mSend.disabled = false; mQ.disabled = false;
    try { mQ.focus(); } catch (_) {}
  }
});

/* ---------- التهيئة ---------- */
(async function init(){
  try{
    const p = JSON.parse(localStorage.getItem(KEY_PROFILE) || "null");
    if (p) ["full_name","student_id","program_code","level_code"].forEach(k => { if (p[k]) $(k).value = p[k]; });
    const d = JSON.parse(localStorage.getItem(KEY_DATA) || "null");
    if (d && Array.isArray(d.lessons) && Array.isArray(d.courses)) data = d;
  }catch(_){}
  applyData();

  if (!initData){ flash(OUTSIDE_TG_MSG, "err"); return; }

  try{
    const s = await api("init-session");
    if (s.status === "REGISTERED" && s.student){
      registered = true;
      const st = s.student;
      if (st.full_name) $("full_name").value = st.full_name;
      if (st.program_code) $("program_code").value = st.program_code;
      if (st.level_code) $("level_code").value = st.level_code;
      // init-session يحمل courses و active_curriculum؛ get-curriculum احتياط فقط
      const base = s.active_curriculum ? s : Object.assign({}, await api("get-curriculum"), { courses: s.courses });
      data = parseSession(base, { program: String(st.program_code || ""), level: String(st.level_code || "") });
      cacheState({
        full_name: st.full_name || "",
        student_id: $("student_id").value.trim(),
        program_code: st.program_code || "",
        level_code: st.level_code || ""
      });
      applyData();
    } else if (s.status === "NEW_STUDENT"){
      registered = false;
      openForm(true);
      flash("أهلاً بك في سَنَد! أكمل بياناتك الجامعية لعرض مقرراتك.", "ok");
    }
  }catch(err){
    console.error("init error:", err);
    flash(errText(err), "err");
  }
})();
</script>
