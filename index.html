<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B192C">
<title>سَنَد — لوحة الطالب</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =========================================================
   Sanad 2.0 — Design System (Internal CSS, zero dependencies)
   ========================================================= */
:root {
  /* Royal Navy */
  --navy-900: #0B192C;
  --navy-800: #11284A;
  --navy-700: #1E3E62;
  --navy-grad: linear-gradient(160deg, #0B192C 0%, #12294A 55%, #1E3E62 100%);

  /* Academic Gold */
  --gold: #D4AF37;
  --gold-soft: #C5A880;
  --gold-glow: 0 0 0 1px rgba(212,175,55,.55), 0 6px 22px rgba(212,175,55,.28);

  /* Surfaces */
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --line: #E6EBF2;
  --text: #0B192C;
  --text-muted: #5B6B82;

  /* Semantic */
  --emerald: #0D9488;
  --emerald-soft: #CCFBF1;
  --pending-bg: #F3F5F9;
  --pending-text: #8A97AB;

  /* Shape & elevation */
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 4px 20px rgba(11,25,44,0.06);
  --shadow-lift: 0 10px 30px rgba(11,25,44,0.14);

  /* Spacing */
  --gap: 14px;
  --pad: 16px;

  --font: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}

/* =========================================================
   1. HEADER
   ========================================================= */
.header {
  position: relative;
  background: var(--navy-grad);
  padding: calc(22px + env(safe-area-inset-top)) var(--pad) 96px;
  text-align: center;
  overflow: hidden;
  border-radius: 0 0 32px 32px;
}
.header::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 85% 10%, rgba(212,175,55,.16), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(30,62,98,.65), transparent 55%);
  pointer-events: none;
}
.header::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: .8;
}
.header > * { position: relative; z-index: 1; }

.xp-badge {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(212,175,55,.45);
  color: var(--gold);
  font-size: 13px; font-weight: 700;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  direction: ltr;
  z-index: 2;
}
.xp-badge .star { font-size: 14px; line-height: 1; }

.logo-wrap {
  width: 104px; height: 104px;
  margin: 18px auto 8px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,175,55,.18), rgba(212,175,55,0) 70%);
  filter: drop-shadow(0 4px 14px rgba(212,175,55,.35));
}
.logo-wrap svg { width: 86px; height: 86px; }

.tagline {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.7;
  color: #FFFFFF;
  letter-spacing: .2px;
  padding: 0 6px;
  text-shadow: 0 2px 10px rgba(0,0,0,.35);
}
.tagline .gold { color: var(--gold); }

/* =========================================================
   2. STUDENT ID CARD
   ========================================================= */
.id-card {
  position: relative;
  margin: -66px var(--pad) 0;
  background: var(--card);
  border-radius: var(--radius);
  padding: 54px var(--pad) var(--pad);
  box-shadow: var(--shadow-lift);
  border: 1px solid rgba(212,175,55,.45);
  z-index: 3;
  overflow: hidden;
}
.id-card::before {
  content: "";
  position: absolute; top: 0; right: 0; left: 0; height: 5px;
  background: linear-gradient(90deg, var(--navy-900), var(--gold), var(--navy-700));
}

.edit-btn {
  position: absolute;
  top: 16px; left: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border-radius: 999px;
  background: #FFFFFF;
  border: 1.5px solid var(--gold);
  color: var(--navy-800);
  font-size: 12px; font-weight: 700;
  box-shadow: 0 2px 10px rgba(212,175,55,.22);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.edit-btn:active { transform: scale(.96); background: #FFFBEB; }
.edit-btn .gear { font-size: 14px; line-height: 1; }

.id-main { display: flex; align-items: center; gap: 12px; }
.avatar {
  flex: 0 0 auto;
  width: 54px; height: 54px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--navy-grad);
  color: var(--gold);
  font-size: 22px; font-weight: 800;
  border: 2px solid var(--gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,.18);
}
.student-name {
  display: flex; align-items: center; gap: 6px;
  font-size: 19px; font-weight: 800; color: var(--navy-900);
  line-height: 1.4;
}
.verified { width: 20px; height: 20px; flex: 0 0 auto; }
.student-college { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.6; }

.level-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 16px; margin-bottom: 8px;
}
.level-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(30,62,98,.08);
  color: var(--navy-700);
  font-size: 12.5px; font-weight: 700;
}
.level-pill::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
}
.level-pct { font-size: 13px; font-weight: 800; color: var(--emerald); direction: ltr; }

.progress {
  width: 100%; height: 10px;
  background: #E8EEF4;
  border-radius: 999px;
  overflow: hidden;
}
.progress > span {
  display: block; height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #0D9488, #14B8A6);
  width: 0;
  transition: width 1.1s cubic-bezier(.22,.8,.3,1);
}
.progress-caption { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }

/* =========================================================
   3. COURSE GRID
   ========================================================= */
.section { padding: 26px var(--pad) 0; }
.section-title {
  font-size: 16px; font-weight: 800; color: var(--navy-900);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; line-height: 1.6;
}
.section-title::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(270deg, var(--line), transparent);
}

.course-grid { display: grid; grid-template-columns: 1fr; gap: var(--gap); }

.course-card {
  position: relative;
  display: block; width: 100%;
  text-align: right;
  background: var(--card);
  border-radius: var(--radius);
  padding: var(--pad);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  transition: transform .18s ease, box-shadow .18s ease;
}
.course-card:active { transform: scale(.985); }

.course-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.course-info { min-width: 0; }
.course-name { font-size: 15.5px; font-weight: 800; color: var(--navy-900); line-height: 1.55; }
.course-code {
  display: inline-block; margin-top: 4px;
  font-size: 12px; font-weight: 700; letter-spacing: .6px;
  color: var(--gold-soft);
  direction: ltr;
}

.badge {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 800;
  white-space: nowrap;
}
.badge-active { background: var(--emerald-soft); color: #0F766E; }
.badge-active::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 0 0 rgba(13,148,136,.6);
  animation: pulse 1.8s infinite;
}
.badge-pending { background: #E9EDF3; color: #6B7A90; }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(13,148,136,.55); }
  70% { box-shadow: 0 0 0 7px rgba(13,148,136,0); }
  100% { box-shadow: 0 0 0 0 rgba(13,148,136,0); }
}

/* Active (featured) course */
.course-card.active {
  border: 1.5px solid var(--gold);
  box-shadow: var(--shadow), var(--gold-glow);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF6 100%);
}
.course-progress { margin-top: 16px; }
.course-progress .row {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-muted); margin-bottom: 7px; font-weight: 600;
}
.course-progress .row b { color: var(--emerald); direction: ltr; }

.cta-btn {
  margin-top: 16px;
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  background: var(--navy-grad);
  color: #FFFFFF;
  font-size: 14.5px; font-weight: 800;
  border: 1px solid var(--gold);
  box-shadow: 0 6px 18px rgba(11,25,44,.28);
  transition: transform .15s ease, box-shadow .15s ease;
}
.cta-btn:active { transform: scale(.98); box-shadow: 0 3px 10px rgba(11,25,44,.25); }
.cta-btn .arrow { color: var(--gold); font-size: 17px; }

/* Pending courses */
.course-card.pending {
  background: var(--pending-bg);
  box-shadow: none;
  border: 1px dashed #CFD6E1;
  cursor: pointer;
}
.course-card.pending .course-name { color: #5F6E84; font-weight: 700; }
.course-card.pending .course-code { color: #A8B2C2; }
.course-card.pending .course-inner { opacity: .82; }

/* Semester 2 accordion */
.semester-toggle {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px var(--pad);
  border-radius: var(--radius);
  background: var(--navy-grad);
  color: #FFFFFF;
  font-size: 15px; font-weight: 800;
  border: 1px solid rgba(212,175,55,.6);
  box-shadow: var(--shadow);
  margin-top: 22px;
  transition: transform .15s ease;
}
.semester-toggle:active { transform: scale(.985); }
.semester-toggle .chev {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(212,175,55,.16);
  color: var(--gold);
  font-size: 14px;
  transition: transform .3s ease;
}
.semester-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

.semester-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .35s ease;
}
.semester-panel.open { grid-template-rows: 1fr; }
.semester-panel > .panel-inner { overflow: hidden; min-height: 0; }
.semester-panel .course-grid { padding-top: 14px; }

/* =========================================================
   4. TOAST
   ========================================================= */
.toast {
  position: fixed;
  left: 14px; right: 14px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  max-width: 492px;
  margin: 0 auto;
  z-index: 100;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 15px 16px;
  border-radius: var(--radius);
  background: var(--navy-900);
  color: #FFFFFF;
  border: 1px solid var(--gold);
  box-shadow: 0 14px 40px rgba(11,25,44,.4);
  transform: translateY(140%);
  opacity: 0;
  pointer-events: none;
  transition: transform .4s cubic-bezier(.22,.9,.3,1), opacity .3s ease;
}
.toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.toast-icon {
  flex: 0 0 auto;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(212,175,55,.16);
  color: var(--gold); font-size: 17px;
}
.toast-text { font-size: 13.5px; line-height: 1.75; font-weight: 600; flex: 1; }
.toast-close {
  flex: 0 0 auto;
  width: 26px; height: 26px; border-radius: 50%;
  color: var(--gold-soft); font-size: 15px;
  background: rgba(255,255,255,.08);
}

/* Entrance animation */
.reveal { opacity: 0; transform: translateY(14px); animation: rise .6s ease forwards; }
.d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; }
@keyframes rise { to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
@media (max-width: 360px) {
  .tagline { font-size: 17px; }
  .edit-btn { font-size: 11px; padding: 6px 10px; }
  .student-name { font-size: 17px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="xp-badge" aria-label="نقاط الخبرة 150"><span class="star">★</span><span>150 XP</span></div>

    <div class="logo-wrap reveal d1">
      <svg viewBox="0 0 120 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شعار سند: قبعة تخرج وكتاب مفتوح ينبثق منه عمود">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">

            <stop offset=".5" stop-color="#D4AF37"/>
            <stop offset="1" stop-color="#A9871E"/>

        </defs>
        <!-- Graduation cap -->
        <polygon points="60,3 100,17 60,31 20,17" fill="url(#goldGrad)"/>
        <path d="M37 25 V34 Q60 44 83 34 V25 L60 33 Z" fill="url(#goldGrad)" opacity=".9"/>
        <line x1="100" y1="17" x2="100" y2="34" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
        <circle cx="100" cy="36" r="3" fill="#D4AF37"/>
        <!-- Column (the "Sanad" pillar) -->
        <rect x="49" y="42" width="22" height="4" rx="1.5" fill="url(#goldGrad)"/>
        <rect x="53" y="46" width="14" height="18" fill="url(#goldGrad)"/>
        <line x1="57" y1="47" x2="57" y2="63" stroke="#0B192C" stroke-opacity=".35" stroke-width="1.2"/>
        <line x1="60" y1="47" x2="60" y2="63" stroke="#0B192C" stroke-opacity=".35" stroke-width="1.2"/>
        <line x1="63" y1="47" x2="63" y2="63" stroke="#0B192C" stroke-opacity=".35" stroke-width="1.2"/>
        <rect x="49" y="64" width="22" height="4" rx="1.5" fill="url(#goldGrad)"/>
        <!-- Open book -->
        <path d="M60 72 Q38 63 10 69 L10 96 Q38 90 60 100 Z" fill="url(#goldGrad)"/>
        <path d="M60 72 Q82 63 110 69 L110 96 Q82 90 60 100 Z" fill="url(#goldGrad)"/>
        <path d="M60 72 L60 100" stroke="#0B192C" stroke-opacity=".5" stroke-width="1.5"/>
        <path d="M17 74 Q38 70 55 77 M17 81 Q38 77 55 84 M17 88 Q38 84 55 91" stroke="#0B192C" stroke-opacity=".3" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M103 74 Q82 70 65 77 M103 81 Q82 77 65 84 M103 88 Q82 84 65 91" stroke="#0B192C" stroke-opacity=".3" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="tagline reveal d2">
      « سَنَد <span class="gold">..</span> مَعَكَ مِنَ المُحَاضَرَةِ إِلَى الاخْتِبَار »
    </h1>
  </header>

  <!-- ================= STUDENT ID CARD ================= -->
  <section class="id-card reveal d3" aria-label="بطاقة الهوية الجامعية">
    <button class="edit-btn" type="button" onclick="openEditModal()">
      <span class="gear" aria-hidden="true">⚙️</span>
      <span>تعديل بياناتي الجامعية</span>
    </button>

    <div class="id-main">
      <div class="avatar" aria-hidden="true">ط</div>
      <div>
        <div class="student-name">
          <span>طلال غالب محمد</span>
          <svg class="verified" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="حساب موثّق">
            <circle cx="12" cy="12" r="11" fill="#0B192C"/>
            <circle cx="12" cy="12" r="10.2" fill="none" stroke="#D4AF37" stroke-width="1"/>
            <polygon points="12,5.2 19,8.6 12,12 5,8.6" fill="#D4AF37"/>
            <path d="M8 11 V14 Q12 16.8 16 14 V11 L12 13 Z" fill="#D4AF37"/>
            <line x1="19" y1="8.6" x2="19" y2="13" stroke="#D4AF37" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="student-college">كلية العلوم الإدارية والإنسانية • قسم المحاسبة</div>
      </div>
    </div>

    <div class="level-row">
      <span class="level-pill">المستوى الأول</span>
      <span class="level-pct">25%</span>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-label="التقدم الأكاديمي">
      <span data-w="25%"></span>
    </div>
    <div class="progress-caption">التقدم الأكاديمي في المستوى الحالي</div>
  </section>

  <!-- ================= COURSES ================= -->
  <main class="section">
    <h2 class="section-title">📚 المقررات الدراسية المعتمدة — الفصل الدراسي الأول</h2>

    <div class="course-grid">

      <!-- ACC101 : Active -->

        <div class="course-inner course-top">
          <div class="course-info">
            <div class="course-name">مبادئ الاقتصاد الجزئي</div>
            <span class="course-code">ECO101</span>
          </div>
          <span class="badge badge-pending">قيد الإعداد الأكاديمي ⏳</span>
        </div>
      </button>

      <!-- ENG101 -->
      <button class="course-card pending" type="button" data-pending="1" aria-label="اللغة الإنجليزية للعلوم الإدارية ENG101 — قيد الإعداد الأكاديمي">

            <span class="course-code">ENG101</span>
          </div>
          <span class="badge badge-pending">قيد الإعداد الأكاديمي ⏳</span>
        </div>
      </button>
    </div>

    <!-- Semester 2 -->
    <button class="semester-toggle" id="semToggle" type="button" aria-expanded="false" aria-controls="semPanel">
      <span>📅 خطة الفصل الدراسي الثاني</span>
      <span class="chev" aria-hidden="true">▼</span>
    </button>

    <div class="semester-panel" id="semPanel">
      <div class="panel-inner">
        <div class="course-grid">
          <button class="course-card pending" type="button" data-pending="1" aria-label="المحاسبة 2 — قيد الإعداد الأكاديمي">
            <div class="course-inner course-top">
              <div class="course-info">
                <div class="course-name">المحاسبة 2</div>
              </div>
              <span class="badge badge-pending">قيد الإعداد الأكاديمي ⏳</span>
            </div>
          </button>
          <button class="course-card pending" type="button" data-pending="1" aria-label="الاقتصاد الكلي — قيد الإعداد الأكاديمي">
            <div class="course-inner course-top">
              <div class="course-info">
                <div class="course-name">الاقتصاد الكلي</div>
              </div>
              <span class="badge badge-pending">قيد الإعداد الأكاديمي ⏳</span>
            </div>
          </button>
          <button class="course-card pending" type="button" data-pending="1" aria-label="الإحصاء — قيد الإعداد الأكاديمي">
            <div class="course-inner course-top">
              <div class="course-info">
                <div class="course-name">الإحصاء</div>
              </div>
              <span class="badge badge-pending">قيد الإعداد الأكاديمي ⏳</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" aria-hidden="true">🎓</div>
  <div class="toast-text" id="toastText"></div>
  <button class="toast-close" type="button" id="toastClose" aria-label="إغلاق">✕</button>
</div>

<script>
(function () {
  'use strict';

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  /* ---------- Telegram bootstrap ---------- */
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#0B192C'); } catch (e) {}
    try { tg.setBackgroundColor('#F8FAFC'); } catch (e) {}
  }

  function haptic(type) {
    try {
      if (tg && tg.HapticFeedback) {
        if (type === 'warn') tg.HapticFeedback.notificationOccurred('warning');
        else tg.HapticFeedback.impactOccurred('light');
      }
    } catch (e) {}
  }

  /* ---------- Toast ---------- */
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;
  var PENDING_MSG = 'أهلاً بك يا زميلنا.. يعكف الطاقم الأكاديمي حالياً على إعداد وتدقيق ملخصات هذا المقرر وفق خطة الكلية، وسيتم إشعارك فور اعتماده.';

  function showToast(message, duration) {
    toastText.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, duration || 5200);
  }
  function hideToast() {
    toast.classList.remove('show');
    clearTimeout(toastTimer);
  }
  document.getElementById('toastClose').addEventListener('click', hideToast);

  /* ---------- Pending courses ---------- */
  var pendingCards = document.querySelectorAll('[data-pending="1"]');
  Array.prototype.forEach.call(pendingCards, function (card) {
    card.addEventListener('click', function () {
      haptic('warn');
      showToast(PENDING_MSG);
    });
  });

  /* ---------- Semester 2 accordion ---------- */
  var semToggle = document.getElementById('semToggle');
  var semPanel = document.getElementById('semPanel');
  semToggle.addEventListener('click', function () {
    var open = semPanel.classList.toggle('open');
    semToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    haptic('light');
  });

  /* ---------- Progress bars animate on load ---------- */
  function animateBars() {
    var bars = document.querySelectorAll('.progress > span[data-w]');
    Array.prototype.forEach.call(bars, function (bar) {
      bar.style.width = bar.getAttribute('data-w');
    });
  }
  if (document.readyState === 'complete') {
    setTimeout(animateBars, 250);
  } else {
    window.addEventListener('load', function () { setTimeout(animateBars, 250); });
  }

  /* ---------- Public handlers (provisional for next phases) ---------- */
  window.openEditModal = function () {
    haptic('light');
    showToast('نافذة تعديل البيانات الجامعية ستتوفر في المرحلة القادمة من التطوير.', 3800);
  };

  window.enterLectureStudio = function (courseCode) {
    haptic('light');
    showToast('جارٍ تجهيز استوديو المحاضرة (' + courseCode + ').. سيتوفر في المرحلة القادمة.', 3800);
  };
})();
</script>
</body>
</html>
